name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release

  build-mipsel:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Fetch mipsel soft-float musl toolchain
        run: mkdir -p toolchain && curl -fsSL https://github.com/cross-tools/musl-cross/releases/download/20261001/mipsel-unknown-linux-muslsf.tar.xz | tar xJ -C toolchain
      - run: ./build.sh
      - run: ls -l target/mipsel-unknown-linux-musl/release/tgbot
      - uses: actions/upload-artifact@v4
        with:
          name: tgbot-mipsel-musl-sf
          path: target/mipsel-unknown-linux-musl/release/tgbot
      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/mipsel-unknown-linux-musl/release/tgbot
