[package]
name = "openwrt-tgbot"
version = "0.1.0"
edition = "2021"
description = "Tiny Telegram bot to control and monitor an OpenWrt router"
license = "MIT"
repository = "https://github.com/lvluu/openwrt-tgbot"
keywords = ["openwrt", "telegram", "router", "wake-on-lan", "bot"]

[[bin]]
name = "tgbot"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tabled = "0.22.0"
wake-on-lan = "0.2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
unicode-width = "0.2.2"
